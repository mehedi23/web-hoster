<!DOCTYPE html>
<html>
<head>
    <title>Email Verification</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .instructions {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .resend-btn {
            background-color: #2196F3;
        }
        .resend-btn:hover {
            background-color: #0b7dda;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Email Verification</h1>
        <p class="instructions">Please enter the verification details from your email. If you didn't receive the email, you can request a new one.</p>
        <form id="verificationForm">
            {% csrf_token %}
            <input type="text" id="uid" name="uid" placeholder="User ID" required>
            <input type="text" id="token" name="token" placeholder="Verification Token" required>
            <button type="submit">Verify Email</button>
        </form>
        <button class="resend-btn" id="resendBtn">Resend Verification Email</button>
        <div id="message"></div>
    </div>

    <script>
        $(document).ready(function() {
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid');
            const token = urlParams.get('token');
            if (uid) $('#uid').val(uid);
            if (token) $('#token').val(token);

            $('#verificationForm').on('submit', function(e) {
                e.preventDefault();
                var formData = $(this).serialize();
                $('#message').removeClass('success error').text('Verifying...');
                $.ajax({
                    url: '/api/user/verify-email/',
                    type: 'POST',
                    data: formData,
                    success: function(response) {
                        if (response.success) {
                            $('#message').addClass('success').text('Email verified successfully! Redirecting to home...');
                            setTimeout(function() {
                                window.location.href = '/';
                            }, 2000);
                        } else {
                            $('#message').addClass('error').text('Verification failed: ' + response.message);
                        }
                    },
                    error: function(xhr) {
                        var response = xhr.responseJSON;
                        if (response && response.message) {
                            $('#message').addClass('error').text('Error: ' + response.message);
                        } else {
                            $('#message').addClass('error').text('An error occurred. Please try again.');
                        }
                    }
                });
            });

            $('#resendBtn').on('click', function() {
                var email = prompt('Enter your email address:');
                if (email) {
                    $('#message').removeClass('success error').text('Sending...');
                    $.ajax({
                        url: '/api/user/send-verification-email/',
                        type: 'POST',
                        data: { email: email },
                        success: function(response) {
                            if (response.success) {
                                $('#message').addClass('success').text('Verification email sent! Check your inbox.');
                            } else {
                                $('#message').addClass('error').text('Failed to send: ' + response.message);
                            }
                        },
                        error: function(xhr) {
                            var response = xhr.responseJSON;
                            $('#message').addClass('error').text('Error: ' + (response ? response.message : 'Unknown error'));
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
