<!DOCTYPE html>
<html>
<head>
    <title>Home</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .user-info {
            margin-bottom: 20px;
            text-align: center;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px;
            background-color: #FF9800;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e68900;
        }
        .logout-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #f44336;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Home Page</h1>
        {% if user.is_authenticated %}
            <div class="user-info">
                <p>Hello, {{ user.email }}!</p>
                <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
            </div>
            <h2>Change Password</h2>
            <form id="passwordForm">
                <input type="text" name="old_password" placeholder="Current Password" required>
                <input type="text" id="new_password" name="new_password" placeholder="New Password" required>
                <input type="text" id="new_password_confirm" name="new_password_confirm" placeholder="Confirm New Password" required>
                <button type="submit">Change Password</button>
            </form>
            <div id="message"></div>
        {% else %}
            <p>Please <a href="/sign-in/">sign in</a> to access more features.</p>
        {% endif %}
    </div>

    <script>
        var csrf_token = '{{ csrf_token }}';
    </script>

    <script>
        $(document).ready(function() {
            $('#passwordForm').on('submit', function(e) {
                e.preventDefault();
                var newPassword = $('#new_password').val();
                var confirmPassword = $('#new_password_confirm').val();
                if (newPassword !== confirmPassword) {
                    $('#message').text('New passwords do not match.');
                    return;
                }
                var formData = $(this).serialize();
                $.ajax({
                    url: '/api/user/password-reset/',
                    type: 'POST',
                    data: formData,
                    headers: {
                        'X-CSRFToken': csrf_token
                    },
                    success: function(response) {
                        if (response.success) {
                            $('#message').css('color', 'green').text('Password updated successfully!');
                        } else {
                            $('#message').text('Password update failed: ' + response.message);
                        }
                    },
                    error: function(xhr) {
                        var response = xhr.responseJSON;
                        if (response && response.errors) {
                            var errors = Object.values(response.errors).flat().join(', ');
                            $('#message').text('Password update failed: ' + errors);
                        } else {
                            $('#message').text('An error occurred. Please try again.');
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
